[package]
name = "omanta"
version = "0.3.0"
edition = "2021"
description = "Talk with any coding agent by voice on Omarchy: a chat TUI with local Kokoro speech"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
libc = "0.2"
ratatui = "0.29"
rodio = { version = "0.19", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
textwrap = "0.16"
toml = "0.8"
unicode-width = "0.2"
ureq = { version = "2", default-features = false, features = ["json"] }

[profile.release]
lto = "thin"
strip = true
